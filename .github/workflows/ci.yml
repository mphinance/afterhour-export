name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Check the app imports and builds its UI
        # Catches breakage the unit tests can't see, since they deliberately skip
        # the Streamlit layer. Never touches the network — a real fetch only starts
        # once a username is submitted.
        run: |
          streamlit run streamlit_app.py --server.headless true --server.port 8501 &
          app_pid=$!
          for _ in $(seq 1 30); do
            if curl --fail --silent http://localhost:8501 > /dev/null 2>&1; then
              echo "app booted OK"
              kill $app_pid
              exit 0
            fi
            sleep 2
          done
          echo "app failed to boot" >&2
          kill $app_pid 2>/dev/null
          exit 1
